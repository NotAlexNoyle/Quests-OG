# Redis URL according to https://redis.github.io/lettuce/user-guide/connecting-redis/#uri-syntax
redisUrl: redis://^{KEYDB_PASSWORD}@127.0.0.1:6379/0

# Debug logging. Leave false in production, enable when reproducing a bug.
debug: false

# Home quest NPCs, one per home tier. Tier 1 is the greeter; tiers 2-6 open that
# home quest. Place them in-game with /questnpc set <tier>, which adds world/x/y/z/
# yaw/pitch to the entry below and spawns it. An entry with only a skin is an NPC
# that is not placed yet. skin holds a raw texture value + signature (MineSkin);
# leave both blank for the default skin.
npcs:
  1:
    # Quest Master: elderly robed sage
    skin:
      value: ""
      signature: ""
  2:
    # Home 2: rugged adventurer
    skin:
      value: ""
      signature: ""
  3:
    # Home 3: miner (slim model)
    skin:
      value: ""
      signature: ""
  4:
    # Home 4: purple sorcerer / alchemist
    skin:
      value: ""
      signature: ""
  5:
    # Home 5: hooded ranger
    skin:
      value: ""
      signature: ""
  6:
    # Home 6: dark knight with gold crown
    skin:
      value: ""
      signature: ""
