name: Quests-OG
version: '${version}'
main: net.trueog.questsOG.QuestsOG
api-version: '${apiVersion}'
depend:
  - DiamondBank-OG
  - Utilities-OG
  - Duels-OG
commands:
  claimquest:
    description: Claims a quest, duh
    usage: /claimquest
  questgui:
    description: Open the layered homes quest menu.
    usage: /questgui
  questnpc:
    description: Manage the home quest NPCs.
    usage: /questnpc <set|remove|tp|list|reload> [tier]
    permission: questsog.admin
permissions:
  questsog.admin:
    description: Manage Quests-OG NPCs.
    default: op
